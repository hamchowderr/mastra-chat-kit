# Self-contained agent stack: Mastra (server + Studio) + Dolt. Mastra storage +
# vectors run on libSQL (a file: DB on the `libsqldata` volume) — no separate
# storage service. One `docker compose up` brings up a complete, portable agent.
# Deploys as a single Coolify "Docker Compose" resource (only `mastra` gets a
# public domain; dolt stays private on the internal network).
#
# Prefer Postgres + pgvector for storage instead? That's a code-level swap plus
# a compose service — see docs/postgres.md.
#
# Secrets come from .env / Coolify env (never commit them):
#   APP_SECRET, DOLT_PASSWORD, and an LLM key
#   (ANTHROPIC_API_KEY / OPENAI_API_KEY). See .env.example.

services:
  mastra:
    build:
      # Repo root: the image installs from the workspace pnpm-lock.yaml — the same
      # lockfile dev and CI use — so the container cannot drift onto other versions.
      context: ../..
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    # Only expose on the internal network — Coolify/Traefik routes the public
    # domain to this service. Do NOT bind a host port here: binding 4111:4111
    # collides ("address already in use") whenever another agent stack is also
    # deployed on the same host. Local host access is via docker-compose.override.yml.
    expose:
      - "4111"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Mastra storage + vectors → libSQL file: DB on the persistent libsqldata
      # volume (absolute path so it lands on the mount, not the ephemeral layer).
      - TURSO_DATABASE_URL=file:/app/data/mastra.db
      # Versioned data (Dolt) → the dolt service (private, internal network)
      - DOLT_HOST=dolt
      - DOLT_PORT=3306
      - DOLT_USER=root
      - DOLT_PASSWORD=${DOLT_PASSWORD}
      - DOLT_DATABASE=${DOLT_DATABASE:-appdb}
    volumes:
      - libsqldata:/app/data # libSQL DB (threads, memory, observability, vectors)
    depends_on:
      dolt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4111/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  dolt:
    image: dolthub/dolt-sql-server:latest
    restart: unless-stopped
    environment:
      # allow root from any host on the internal network (default is localhost-only,
      # which denies the mastra container). Applied on first init only.
      - DOLT_ROOT_HOST=%
      - DOLT_ROOT_PASSWORD=${DOLT_PASSWORD}
    volumes:
      - doltdata:/var/lib/dolt # versioned DB + full commit history (persist!)
    healthcheck:
      test: ["CMD-SHELL", "dolt sql -q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no published port → reachable only as `dolt` on the internal network

volumes:
  libsqldata: {}
  doltdata: {}

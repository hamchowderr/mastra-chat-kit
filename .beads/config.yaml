# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
# issue-prefix: ""

# Use no-db mode: JSONL-only, no Dolt database
# When true, bd will use .beads/issues.jsonl as the source of truth
# no-db: false

# Enable JSON output by default
# json: false

# Feedback title formatting for mutating commands (create/update/close/dep/edit)
# 0 = hide titles, N > 0 = truncate to N characters
# output:
#   title-length: 255

# Default actor for audit trails (overridden by BEADS_ACTOR or --actor)
# actor: ""

# Export events (audit trail) to .beads/events.jsonl on each flush/sync
# When enabled, new events are appended incrementally using a high-water mark.
# Use 'bd export --events' to trigger manually regardless of this setting.
# events-export: false

# Multi-repo configuration (experimental - bd-307)
# Allows hydrating from multiple repositories and routing writes to the correct database
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# JSONL backup (periodic export for off-machine recovery)
# Auto-enabled when a git remote exists. Override explicitly:
# backup:
#   enabled: false     # Disable auto-backup entirely
#   interval: 15m      # Minimum time between auto-exports
#   git-push: false    # Disable git push (export locally only)
#   git-repo: ""       # Separate git repo for backups (default: project repo)

# Integration settings (access with 'bd config get/set')
# Non-secret keys (stored in the database):
# - jira.url, jira.project
# - linear.team_id
# - github.org, github.repo
#
# Secret keys (stored in this file but prefer env vars to avoid git exposure):
# - linear.api_key  → use LINEAR_API_KEY env var instead
# - github.token    → use GITHUB_TOKEN env var instead

export.auto: true
export:
    git-add: false

# sync.remote is deliberately ABSENT, and the Dolt remote is configured per-clone
# instead. Two separate reasons, both verified:
#
# 1. NEVER point it at the git origin. Beads defaults this key to the git remote,
#    and a successful 'bd dolt push' then writes a refs/heads/__dolt_remote_info__
#    branch to GitHub. This repo was wired to a Vercel project that built every
#    branch, and that one holds a single file and no packages/web — so every push
#    queued a deployment that died at checkout in ~1s.
#
# 2. The value here is a machine path, and this file is COMMITTED. It published
#    a local directory layout to a public repo for no benefit, because the remote
#    bd actually pushes to is stored in .dolt/repo_state.json inside the (gitignored)
#    embedded database — NOT read from this key at push time. Removing it changes
#    nothing about how pushes behave on a clone that already has a remote set.
#
# The value lives in .beads/.env instead, which .beads/.gitignore:57 ignores:
#
#     BD_SYNC_REMOTE=file://<absolute/path/to/a/backup-dir>
#
# That is not merely cosmetic. With NO value resolvable, every write past the
# auto-export throttle prints:
#
#     beads: auto-export warning: no Dolt remote configured.
#     beads: repair: bd dolt remote add origin git+https://github.com/... && bd dolt push
#
# i.e. bd repeatedly instructs you to do reason 1. Verified A/B with
# BD_EXPORT_INTERVAL=1s: 3/3 writes warn without .beads/.env, 0/3 with it.
#
# On a fresh clone, write that .env and then:
#
#     bd dolt remote add origin file://<same/path>   # writes .dolt/repo_state.json
#     bd dolt push
#
# Do NOT use a relative path or '~' — 'bd dolt remote add' absolutizes the value
# immediately, against the Dolt DATA DIR rather than the repo root, and does not
# expand a tilde. Both land nested inside .beads/embeddeddolt/ (a "backup" on the
# same disk, inside the thing it is backing up). Point it at DoltHub when those
# remotes exist.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Tier 1–3.5 only: deterministic, AIMock-backed, zero API spend, no secrets.
# Real-provider (Tier 4) tests are intentionally NOT run in CI.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # createDefaultMemory() always wires `embedder: fastembed`, so every run that
      # builds a Memory pulls the bge-small ONNX model (~130MB) into ~/.cache/mastra.
      # Uncached, that download has been failing mid-flight — observed as both
      # "ZlibError: zlib: unexpected end of file" (truncated) and "Tokenizer file not
      # found" (never finished), after which Mastra logs "Failed to probe embedder for
      # dimension, falling back to default". Nothing fails, because no test asserts on
      # embeddings — so a genuinely broken embedder is invisible here. Caching removes
      # the repeated download and the corruption with it.
      - name: Cache the fastembed model
        uses: actions/cache@v4
        with:
          path: ~/.cache/mastra/fastembed-models
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5

      - name: Lint (biome)
        run: pnpm lint

      - name: Server tests (Tier 1 — Vitest + AIMock, in-memory store)
        run: pnpm --filter @mastra-chat-kit/server test

      - name: Web component tests (jsdom + RTL, all 48 elements)
        run: pnpm --filter @mastra-chat-kit/web test

      - name: Web production build
        run: pnpm --filter @mastra-chat-kit/web build
